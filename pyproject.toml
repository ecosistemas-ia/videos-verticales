[project]
name = "videos-verticales"
version = "0.1.0"
description = "La voz de los videos: Kokoro en tu computadora (gratis) o ElevenLabs (de pago)"
# kokoro-onnx 0.6.1 no admite Python 3.14: uv elige o descarga uno compatible.
requires-python = ">=3.10,<3.14"
dependencies = [
    "kokoro-onnx==0.6.1",
    "soundfile>=0.13",
    "numpy>=1.26",
]

[tool.uv]
package = false
